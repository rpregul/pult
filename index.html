<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Пульт">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#06060E">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Пульт выкладки</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@700;800&display=swap">

<style>
  :root{
    --bg0:#06060E;
    --ink:#ECECFF; --muted:#9C9CC8; --faint:#66668E;
    --neon:#3DE1FF; --neon-rgb:61,225,255;      /* action / accent */
    --violet:#C061FF; --violet-rgb:192,97,255;
    --mint:#2BF0B0; --mint-rgb:43,240,176;       /* done */
    --amber:#FFB020; --amber-rgb:255,176,32;     /* pending */
    --glass:linear-gradient(158deg, rgba(255,255,255,.075), rgba(255,255,255,.022));
    --glass-2:linear-gradient(158deg, rgba(255,255,255,.055), rgba(255,255,255,.015));
    --brd:rgba(255,255,255,.11);
    --brd-2:rgba(255,255,255,.16);
    --hi:inset 0 1px 0 rgba(255,255,255,.16);
    --sh:0 24px 50px -26px rgba(0,0,0,.85);
    --blur:blur(20px) saturate(1.6);
    --r:20px; --r-sm:13px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;max-width:100%;overflow-x:hidden}
  body{
    background:var(--bg0); color:var(--ink);
    font-family:"Manrope",system-ui,sans-serif; font-size:15px; line-height:1.5;
    -webkit-font-smoothing:antialiased; padding-bottom:92px; position:relative; min-height:100vh;
  }
  .mono{font-family:"JetBrains Mono",ui-monospace,monospace}
  button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none}
  ::selection{background:var(--neon);color:#04121a}

  /* ambient neon background */
  .bg{position:fixed;inset:0;z-index:-2;background:
    radial-gradient(45% 32% at 12% 8%, rgba(var(--neon-rgb),.30), transparent 72%),
    radial-gradient(42% 30% at 88% 12%, rgba(var(--violet-rgb),.30), transparent 72%),
    radial-gradient(50% 34% at 82% 88%, rgba(var(--mint-rgb),.20), transparent 72%),
    radial-gradient(46% 32% at 8% 92%, rgba(var(--violet-rgb),.18), transparent 72%),
    var(--bg0);}
  .orb{position:fixed;z-index:-1;border-radius:50%;filter:blur(70px);opacity:.5;pointer-events:none}
  .orb.a{width:60vw;height:60vw;left:-15vw;top:-10vh;background:radial-gradient(circle,rgba(var(--neon-rgb),.5),transparent 65%);animation:drift1 26s ease-in-out infinite}
  .orb.b{width:55vw;height:55vw;right:-12vw;bottom:2vh;background:radial-gradient(circle,rgba(var(--violet-rgb),.45),transparent 65%);animation:drift2 32s ease-in-out infinite}
  @keyframes drift1{50%{transform:translate(8vw,10vh) scale(1.1)}}
  @keyframes drift2{50%{transform:translate(-9vw,-8vh) scale(1.08)}}

  .app{width:100%;max-width:560px;margin:0 auto;position:relative}

  /* header */
  header{position:sticky;top:0;z-index:40;
    background:linear-gradient(180deg, rgba(6,6,14,.82), rgba(6,6,14,.45));
    backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
    border-bottom:1px solid var(--brd)}
  .bar{display:flex;align-items:center;gap:10px;padding:13px 16px 11px}
  .brand{display:flex;align-items:baseline;gap:9px;margin-right:auto}
  .brand b{font-family:"Unbounded","Manrope",system-ui,sans-serif;font-weight:800;font-size:20px;letter-spacing:0}
  .brand .dot{width:8px;height:8px;border-radius:50%;background:var(--neon);display:inline-block;
    transform:translateY(-2px);box-shadow:0 0 12px 1px rgba(var(--neon-rgb),.9)}
  .brand span{font-size:10.5px;color:var(--muted);letter-spacing:.22em;text-transform:uppercase;font-weight:700}
  .live{display:flex;align-items:center;gap:6px;font-size:10.5px;font-weight:700;color:var(--mint);
    letter-spacing:.1em;text-transform:uppercase;padding:6px 11px;border-radius:99px;
    background:rgba(var(--mint-rgb),.10);border:1px solid rgba(var(--mint-rgb),.3)}
  .live i{width:6px;height:6px;border-radius:50%;background:var(--mint);box-shadow:0 0 8px 1px var(--mint);animation:pulse 2s infinite}
  .refresh-btn{flex:0 0 auto;width:38px;height:38px;margin-left:8px;border-radius:11px;border:1px solid var(--brd-2);background:rgba(var(--neon-rgb),.10);color:var(--neon);display:grid;place-items:center;box-shadow:0 0 14px -6px rgba(var(--neon-rgb),.7);transition:.25s}
  .refresh-btn svg{width:19px;height:19px}
  .refresh-btn:active{transform:rotate(-180deg) scale(.9)}
  .live[data-mode="warn"]{color:var(--amber);border-color:rgba(var(--amber-rgb),.45);background:rgba(var(--amber-rgb),.10)}
  .live[data-mode="warn"] i{background:var(--amber);box-shadow:0 0 8px 1px var(--amber)}
  @keyframes pulse{50%{opacity:.35}}

  .niches{display:flex;gap:8px;padding:2px 16px 13px;overflow-x:auto;scrollbar-width:none}
  .niches::-webkit-scrollbar{display:none}
  .nchip{flex:0 0 auto;padding:8px 14px;border-radius:99px;border:1px solid var(--brd);
    background:var(--glass-2);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
    font-size:13px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:8px;
    transition:.18s;white-space:nowrap}
  .nchip .swatch{width:9px;height:9px;border-radius:50%;box-shadow:0 0 8px 0 currentColor}
  .nchip[data-on="1"]{color:var(--ink);border-color:var(--brd-2);
    background:linear-gradient(158deg, rgba(var(--neon-rgb),.16), rgba(var(--neon-rgb),.05));
    box-shadow:0 0 20px -6px rgba(var(--neon-rgb),.7), var(--hi)}
  .nchip .cnt{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:11px;color:var(--faint)}
  .nchip[data-on="1"] .cnt{color:var(--neon)}

  main{padding:20px 16px 40px}
  .eyebrow{font-family:"Manrope",system-ui,sans-serif;font-size:11px;font-weight:800;letter-spacing:.2em;
    text-transform:uppercase;color:var(--faint)}
  .view-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
  .view-head h1{font-family:"Unbounded","Manrope",system-ui,sans-serif;font-weight:800;font-size:28px;margin:4px 0 0;letter-spacing:-.02em}

  /* glass panel base */
  .glass{background:var(--glass);border:1px solid var(--brd);
    backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);box-shadow:var(--hi),var(--sh)}

  /* hero */
  .hero{border-radius:var(--r);padding:18px;margin-bottom:16px;background:var(--glass);
    border:1px solid var(--brd);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
    box-shadow:var(--hi),var(--sh);position:relative;overflow:hidden}
  .hero::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;
    background:radial-gradient(80% 60% at 90% 0%, rgba(var(--neon-rgb),.14), transparent 60%)}
  .hero>*{position:relative;z-index:1}
  .hero-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
  .streakwrap{display:flex;align-items:center;gap:12px;min-width:0}
  .flame{font-size:26px;line-height:1;filter:drop-shadow(0 0 10px rgba(var(--amber-rgb),.7))}
  .snum{font-family:"Manrope",system-ui,sans-serif;font-weight:800;font-size:23px;line-height:1;letter-spacing:-.01em}
  .snum span{font-family:"Manrope",system-ui,sans-serif;font-weight:700;font-size:12px;color:var(--muted);letter-spacing:0}
  .ssub{font-size:11px;color:var(--faint);margin-top:5px;font-weight:600}
  .todaypill{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:13px;font-weight:700;color:var(--muted);flex:0 0 auto;
    background:rgba(255,255,255,.05);border:1px solid var(--brd);padding:8px 13px;border-radius:99px;white-space:nowrap}
  .todaypill b{color:var(--ink)}
  .todaypill[data-full="1"]{color:var(--mint);border-color:rgba(var(--mint-rgb),.4);
    background:rgba(var(--mint-rgb),.10);box-shadow:0 0 18px -6px rgba(var(--mint-rgb),.8)}
  .todaypill[data-full="1"] b{color:var(--mint)}

  .cal-weekdays{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-bottom:6px}
  .cal-weekdays span{font-family:"Manrope",system-ui,sans-serif;font-weight:700;font-size:9px;letter-spacing:.05em;
    color:var(--faint);text-align:center;text-transform:uppercase}
  .cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
  .cell{min-width:0;aspect-ratio:1;border-radius:8px;display:grid;place-items:center;position:relative;
    background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.06);transition:.2s}
  .cell.empty{background:transparent;border:none}
  .cell svg{width:12px;height:12px;color:#EAF0FF;opacity:.92}
  .cell.fill{background:rgba(var(--neon-rgb),var(--i,.4));border-color:transparent;
    box-shadow:0 0 13px -3px rgba(var(--neon-rgb),calc(var(--i,.4) + .1))}
  .cell.full{background:linear-gradient(150deg,var(--mint),#12c48f);border-color:transparent;
    box-shadow:0 0 18px -3px rgba(var(--mint-rgb),.85), var(--hi)}
  .cell.full svg{color:#03170f;opacity:1}
  .cell[data-today="1"]{box-shadow:0 0 0 2px var(--neon), 0 0 16px -1px rgba(var(--neon-rgb),.8)}

  .goal{margin-top:18px}
  .goal-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
    font-size:12.5px;color:var(--muted);margin-bottom:9px;font-weight:600}
  .goal-top b{color:var(--ink);font-family:"JetBrains Mono",ui-monospace,monospace;font-weight:700}
  .goal-top .rem{text-align:right;flex:0 0 auto}
  .goal-top .rem b{color:var(--neon);text-shadow:0 0 12px rgba(var(--neon-rgb),.7)}
  .goaltrack{position:relative;height:11px;border-radius:99px;background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.08)}
  .goaltrack .fill{position:absolute;left:0;top:0;bottom:0;border-radius:99px;
    background:linear-gradient(90deg,var(--violet),var(--neon));
    box-shadow:0 0 18px -1px rgba(var(--neon-rgb),.85);transition:width .5s}
  .goaltrack .rest{position:absolute;top:0;bottom:0;border:1.5px dashed rgba(var(--neon-rgb),.55);
    border-left:none;border-radius:0 99px 99px 0}
  .goal-cap{font-size:11.5px;color:var(--faint);margin-top:11px;line-height:1.5;font-weight:500}
  .goal-cap b{color:var(--neon);font-weight:700}

  /* views infographic */
  .vcard{border-radius:var(--r);padding:17px 18px;margin-bottom:16px;background:var(--glass);
    border:1px solid var(--brd);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);box-shadow:var(--hi),var(--sh)}
  .vhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
  .vtotal{font-family:"JetBrains Mono",ui-monospace,monospace;font-weight:700;font-size:25px;margin-top:5px;
    color:var(--ink);text-shadow:0 0 16px rgba(var(--neon-rgb),.5)}
  .vupd{font-size:10px;color:var(--faint);font-weight:600;text-align:right;line-height:1.5;flex:0 0 auto}
  .vsub{font-size:10.5px;color:var(--faint);font-weight:600;margin-top:3px}
  .legend{display:flex;gap:14px;margin:2px 0 6px;flex-wrap:wrap}
  .legend span{display:flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;color:var(--muted)}
  .legend i{width:11px;height:3px;border-radius:2px;display:inline-block}
  .lchart{width:100%;height:auto;display:block;overflow:visible;touch-action:manipulation}
  .lline{filter:drop-shadow(0 0 5px rgba(var(--neon-rgb),.8))}
  .ldot{fill:var(--neon);stroke:var(--bg0);stroke-width:1.5}
  .ldot.llast{fill:var(--mint);filter:drop-shadow(0 0 6px rgba(var(--mint-rgb),.95))}
  .lhit{fill:transparent;cursor:pointer}
  .lval{fill:var(--ink);font-size:9px;font-weight:700;font-family:"JetBrains Mono",ui-monospace,monospace}
  .lx{fill:var(--faint);font-size:8px;font-family:"JetBrains Mono",ui-monospace,monospace}
  .vgoalnum{color:var(--faint);font-weight:600;font-size:16px}
  .gline{stroke:rgba(var(--mint-rgb),.55);stroke-width:1;stroke-dasharray:3 3}
  .glabel{fill:var(--mint);font-size:9px;font-weight:700;font-family:"JetBrains Mono",ui-monospace,monospace}
  .lproj{stroke:var(--violet);stroke-width:2;stroke-dasharray:4 4;fill:none;filter:drop-shadow(0 0 4px rgba(var(--violet-rgb),.7))}
  .gmark{fill:var(--violet);filter:drop-shadow(0 0 6px rgba(var(--violet-rgb),.95))}
  .glabel2{fill:var(--violet);font-size:9px;font-weight:700;font-family:"JetBrains Mono",ui-monospace,monospace}
  .money-note{display:flex;gap:10px;margin-top:12px;padding:12px 13px;border-radius:13px;
    background:rgba(var(--mint-rgb),.09);border:1px solid rgba(var(--mint-rgb),.28);font-size:12px;line-height:1.5;color:var(--ink)}
  .money-note .mn-ic{font-size:18px;flex:0 0 auto;line-height:1.2}
  .money-note b{font-weight:700}
  .mn-sum{color:var(--mint);font-family:"JetBrains Mono",ui-monospace,monospace;font-size:13px}
  .vgoal{margin-top:14px;border-top:1px solid var(--brd);padding-top:15px}
  .vhint{color:var(--faint);font-weight:500;font-size:10px;text-transform:none;letter-spacing:0}
  .vcard.vempty p{font-size:12.5px;color:var(--muted);margin:9px 0 0;line-height:1.55}

  /* niche blocks */
  .nblock{border-radius:var(--r);margin-bottom:14px;overflow:hidden;background:var(--glass-2);
    border:1px solid var(--brd);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
    box-shadow:var(--hi),var(--sh)}
  .nb-head{display:flex;align-items:center;gap:11px;padding:15px 16px 13px}
  .nb-head .swatch{width:12px;height:12px;border-radius:50%;flex:0 0 auto;box-shadow:0 0 12px 0 currentColor}
  .nb-head .nm{font-family:"Manrope",system-ui,sans-serif;font-weight:800;font-size:17px;letter-spacing:-.01em}
  .nb-head .tg{font-size:10px;color:var(--faint);font-weight:700;letter-spacing:.1em;text-transform:uppercase}
  .nb-head .frac{margin-left:auto;font-family:"JetBrains Mono",ui-monospace,monospace;font-size:12.5px;font-weight:700;
    color:var(--muted);padding:4px 11px;border-radius:99px;background:rgba(255,255,255,.05);border:1px solid var(--brd)}
  .nb-head .frac[data-full="1"]{background:rgba(var(--mint-rgb),.12);color:var(--mint);
    border-color:rgba(var(--mint-rgb),.35);box-shadow:0 0 16px -6px rgba(var(--mint-rgb),.8)}

  .slot{display:flex;align-items:center;gap:11px;padding:11px 16px;border-top:1px solid rgba(255,255,255,.06);
    cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background .15s}
  .slot:active{background:rgba(255,255,255,.05)}
  .badge{flex:0 0 auto;width:36px;height:26px;border-radius:7px;display:grid;place-items:center;
    font-family:"Manrope",system-ui,sans-serif;font-weight:800;font-size:11px;letter-spacing:.02em;
    background:rgba(255,255,255,.06);color:var(--muted);border:1px solid var(--brd)}
  .slot-main{flex:1;min-width:0}
  .slot-main .sn{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .slot-main .sc{font-size:10.5px;color:var(--faint);margin-top:2px;font-family:"JetBrains Mono",ui-monospace,monospace;font-weight:500}
  .copy-btn{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:8px 13px;border-radius:9px;
    background:rgba(var(--neon-rgb),.12);border:1px solid rgba(var(--neon-rgb),.38);color:var(--neon);
    font-weight:700;font-size:12.5px;transition:.15s;box-shadow:0 0 14px -6px rgba(var(--neon-rgb),.7)}
  .copy-btn svg{width:13px;height:13px}
  .copy-btn:active{transform:scale(.93)}
  .check{flex:0 0 auto;width:30px;height:30px;border-radius:9px;border:1.5px solid var(--brd-2);
    background:rgba(255,255,255,.04);display:grid;place-items:center;transition:.18s;color:transparent}
  .check svg{width:15px;height:15px}
  .slot[data-done="1"]{background:rgba(var(--mint-rgb),.07)}
  .slot[data-done="1"] .check{background:linear-gradient(150deg,var(--mint),#11c691);border-color:transparent;
    color:#03170f;box-shadow:0 0 16px -3px rgba(var(--mint-rgb),.85)}
  .slot[data-done="1"] .badge{background:rgba(var(--mint-rgb),.12);color:var(--mint);border-color:transparent}
  .slot[data-done="1"] .sn{color:var(--muted)}
  .slot[data-done="1"] .copy-btn{background:rgba(255,255,255,.04);border-color:var(--brd);color:var(--faint);box-shadow:none}
  .done-at{flex:0 0 auto;font-family:"JetBrains Mono",ui-monospace,monospace;font-size:10px;color:var(--mint);display:none}
  .slot[data-done="1"] .done-at{display:block}

  .empty{text-align:center;padding:60px 20px;color:var(--faint)}
  .empty .big{font-family:"Manrope",system-ui,sans-serif;font-weight:800;font-size:20px;color:var(--muted);margin-bottom:6px}

  /* library cards */
  .card{border-radius:var(--r);margin-bottom:12px;overflow:hidden;background:var(--glass-2);
    border:1px solid var(--brd);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
    box-shadow:var(--hi),var(--sh)}
  .card-top{display:flex;gap:14px;padding:15px;align-items:center;cursor:pointer;transition:.15s}
  .card-top:active{background:rgba(255,255,255,.03)}
  .thumb{flex:0 0 auto;width:52px;height:68px;border-radius:11px;position:relative;overflow:hidden;
    display:grid;place-items:center;color:#fff;font-family:"Manrope",system-ui,sans-serif;font-weight:800;font-size:19px;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.18), 0 0 22px -8px currentColor}
  .thumb .pid{position:absolute;bottom:4px;left:0;right:0;text-align:center;
    font-family:"JetBrains Mono",ui-monospace,monospace;font-size:8px;opacity:.9;font-weight:600}
  .card-meta{flex:1;min-width:0}
  .card-meta .niche-tag{font-size:11px;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:7px}
  .card-meta .niche-tag .swatch{width:8px;height:8px;border-radius:50%;box-shadow:0 0 8px 0 currentColor}
  .card-meta h3{font-size:15px;font-weight:700;margin:4px 0 0;line-height:1.3;letter-spacing:-.01em}
  .card-badges{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
  .mini-badge{font-family:"Manrope",system-ui,sans-serif;font-weight:800;font-size:9.5px;letter-spacing:.03em;padding:3px 7px;
    border-radius:6px;background:rgba(var(--neon-rgb),.1);color:var(--neon);border:1px solid rgba(var(--neon-rgb),.25)}
  .chev{flex:0 0 auto;color:var(--faint)}
  .chev svg{width:20px;height:20px}
  .add-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px;
    border-radius:var(--r);border:1.5px dashed var(--brd-2);color:var(--muted);font-weight:700;font-size:14px;
    background:rgba(255,255,255,.02);transition:.15s;margin-top:4px}
  .add-btn:active{border-color:var(--neon);color:var(--neon)}
  .add-btn svg{width:17px;height:17px}

  /* rhythm */
  .rhythm-wrap{overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
  .rhythm-wrap::-webkit-scrollbar{display:none}
  table.rhythm{border-collapse:separate;border-spacing:0;width:100%;min-width:430px}
  table.rhythm thead th{font-family:"Manrope",system-ui,sans-serif;font-weight:800;font-size:11px;letter-spacing:.06em;
    color:var(--muted);text-align:center;padding:0 0 11px}
  table.rhythm thead th:first-child{text-align:left}
  .rn{font-weight:700;font-size:13.5px;padding-right:12px;white-space:nowrap}
  .rn small{display:block;font-weight:600;font-size:10px;color:var(--faint);letter-spacing:.08em;
    text-transform:uppercase;font-family:"Manrope",system-ui,sans-serif;margin-top:2px}
  .rcell{padding:5px}
  .cad-cell{border-radius:12px;background:var(--glass-2);border:1px solid var(--brd);padding:9px 6px;
    text-align:center;backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur)}

  if(t) t.textContent=text; if(el){ el.dataset.mode=warn?"warn":"ok"; el.title=err?("код: "+err):""; }
}
function save(){
  try{ localStorage.setItem(LS, trackJSON()); }catch(e){}
  if(ART){ clearTimeout(_cloudT); _cloudT=setTimeout(cloudSave, 400); }
}
async function cloudSave(){
  if(!ART) return;
  try{ await ART.publish({"track.json": trackJSON()}); setBadge("☁ сервер", false); }
  catch(e){ const code=(e&&e.code)||"err"; if(code!=="conflict") setBadge("⚠ локально", true, code); }
}
async function initCloud(){
  if(typeof claude==="undefined" || !claude.use){ setBadge("💾 на устройстве", false); return; }
  try{ ART = await claude.use("artifact"); }catch(e){ ART=null; }
  if(!ART){ setBadge("⚠ локально", true, "null"); return; }
  // восстановить сохранённое
  try{
    const r=await fetch("track.json",{cache:"no-store"});
    if(r.ok){ const t=await r.json();
      if(t && t.daily){ state.daily=t.daily; if(t.log) state.log=t.log; state.overrides=t.overrides||{};
        migrateDaily(); applyOverrides(); rollover();
        try{ localStorage.setItem(LS, trackJSON()); }catch(e){} render(); }
    }
  }catch(e){}
  // ПРОВЕРКА записи: если сервер реально принимает — бейдж зелёный, иначе жёлтый с кодом
  try{ await ART.publish({"track.json": trackJSON()}); setBadge("☁ сервер", false); }
  catch(e){ setBadge("⚠ локально", true, (e&&e.code)||"err"); }
}

function migrateDaily(){ if(!state.daily) state.daily={}; if(!state.overrides) state.overrides={};
  state.niches.forEach(n=>{ if(!state.daily[n.id]) state.daily[n.id]={}; }); }
function applyOverrides(){ for(const k in state.overrides){ const [vid,pid,f]=k.split("|"); const v=state.videos.find(x=>x.id===vid); if(v&&v.targets[pid]) v.targets[pid][f]=state.overrides[k]; } }

const dayKeyOffset=off=>new Date(Date.now()-off*86400000).toLocaleDateString("en-CA",{timeZone:"Europe/Moscow"});
function seedLog(){ if(state.log) return;
  // Реальная история постинга (без демо). Таро стартовало 19.08 (3 дня назад).
  // Что знаем по кросс-постам: 21.08 = IG, 20.08 = IG, 19.08 = IG + VK.
  state.log={tarot:{}, neuro:{}};
  const real={1:1, 2:1, 3:2};
  for(const off in real) state.log.tarot[dayKeyOffset(+off)]=real[off]; }
function rollover(){ const today=mKey();
  for(const nid in state.daily){ if(!state.log[nid]) state.log[nid]={};
    for(const k in state.daily[nid]){ if(k.endsWith("_t"))continue;
      const dk=state.daily[nid][k]; if(dk!==today){ state.log[nid][dk]=(state.log[nid][dk]||0)+1; delete state.daily[nid][k]; delete state.daily[nid][k+"_t"]; } } } }
function nicheTarget(nid){ return slotsOf(nid).length; }
function nicheDoneToday(nid){ let c=0; slotsOf(nid).forEach(p=>{ if(doneToday(nid,p.id)) c++; }); return c; }
function nicheTotal(nid){ let s=nicheDoneToday(nid); const lg=state.log[nid]||{}; for(const k in lg) s+=lg[k]; return s; }
const MILES=[150,300,600,1200,2400];
function nextMile(t){ return MILES.find(m=>m>t) || Math.ceil((t+1)/1000)*1000; }
function prevMile(t){ return MILES.filter(m=>m<=t).pop() || 0; }
function nicheStreak(nid){ const th=1; let s=0,off; const lg=state.log[nid]||{};
  if(nicheDoneToday(nid)>=th){s++;off=1;}else off=1;
  while(true){ const c=lg[dayKeyOffset(off)]; if(c===undefined||c<th)break; s++; off++; } return s; }

const plat=id=>state.platforms.find(p=>p.id===id);
const niche=id=>state.niches.find(n=>n.id===id);
const slotsOf=nid=>state.platforms.filter(p=>state.cadence[nid]&&state.cadence[nid][p.id]);
const doneToday=(nid,pid)=> state.daily[nid] && state.daily[nid][pid]===mKey();
const nichePending=nid=>slotsOf(nid).filter(p=>!doneToday(nid,p.id)).length;
const firstCap=(nid,pid)=>{ const v=state.videos.find(v=>v.niche===nid && v.targets[pid]); return v?v.targets[pid].caption:""; };
function visNiches(){ return activeNiche==="all"?state.niches:state.niches.filter(n=>n.id===activeNiche); }

function toast(m){ const t=$("#toast"); $("#toastMsg").textContent=m; t.dataset.show="1";
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.dataset.show="0",1600); }
async function copy(text,msg){
  if(!text){ toast("Пусто — нечего копировать"); return; }
  try{ await navigator.clipboard.writeText(text); }
  catch(e){ const ta=document.createElement("textarea"); ta.value=text; document.body.append(ta); ta.select(); document.execCommand("copy"); ta.remove(); }
  toast(msg||"Скопировано");
}
function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function confetti(){
  if(matchMedia("(prefers-reduced-motion:reduce)").matches) return;
  const c=$("#fx"); if(!c) return; const ctx=c.getContext("2d");
  c.width=innerWidth; c.height=innerHeight;
  const cols=["#3DE1FF","#C061FF","#2BF0B0","#FFB020","#4D7CFF","#ffffff"];
  const cx=innerWidth/2, cy=innerHeight*0.4, parts=[];
  for(let i=0;i<120;i++){ const a=Math.random()*Math.PI*2, sp=4+Math.random()*12;
    parts.push({x:cx,y:cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-6,g:.28+Math.random()*.13,
      s:5+Math.random()*7,rot:Math.random()*6.3,vr:(Math.random()-.5)*.5,col:cols[i%cols.length]}); }
  let t=0;
  (function frame(){ ctx.clearRect(0,0,c.width,c.height); t++;
    for(const p of parts){ p.vy+=p.g; p.x+=p.vx; p.y+=p.vy; p.vx*=.99; p.rot+=p.vr;
      ctx.save(); ctx.globalAlpha=Math.max(0,1-t/95); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
      ctx.fillStyle=p.col; ctx.shadowColor=p.col; ctx.shadowBlur=10;
      ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.62); ctx.restore(); }
    if(t<95) requestAnimationFrame(frame); else ctx.clearRect(0,0,c.width,c.height);
  })();
}
function celebrate(kind,title,sub){
  const b=$("#celebrate"); if(!b) return; const sc=$("#celeScrim");
  b.innerHTML=`<div class="cele-emoji">${kind==="goal"?"🏆":"🎉"}</div><div class="cele-t">${title}</div><div class="cele-s">${sub}</div>`;
  if(sc) sc.dataset.show="1"; b.dataset.show="1"; confetti();
  if(navigator.vibrate) navigator.vibrate(kind==="goal"?[30,40,30,40,70]:[20,35,45]);
  clearTimeout(celebrate._t); celebrate._t=setTimeout(()=>{ b.dataset.show="0"; if(sc) sc.dataset.show="0"; }, kind==="goal"?3400:2600);
}

function lineChart(daily){
  const W=320,H=132,padL=8,padR=8,padT=16,padB=22;
  const max=Math.max(...daily.map(d=>d.v),1), n=daily.length;
  const X=i=> padL+(W-padL-padR)*(n<2?.5:i/(n-1));
  const Y=v=> padT+(H-padT-padB)*(1-v/max);
  const pts=daily.map((d,i)=>[X(i),Y(d.v)]);
  const line=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const area=`M${pts[0][0].toFixed(1)} ${H-padB} `+pts.map(p=>"L"+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ")+` L${pts[n-1][0].toFixed(1)} ${H-padB} Z`;
  const dots=daily.map((d,i)=>{ const last=i===n-1;
    return `<circle class="ldot${last?" llast":""}" cx="${X(i).toFixed(1)}" cy="${Y(d.v).toFixed(1)}" r="${last?4.5:3}"/>`;
  }).join("");
  const hits=daily.map((d,i)=>`<circle class="lhit" cx="${X(i).toFixed(1)}" cy="${Y(d.v).toFixed(1)}" r="15" data-d="${d.d}" data-v="${d.v}" data-u="охват"/>`).join("");
  const peak=daily.reduce((a,b,i)=>b.v>daily[a].v?i:a,0);
  const vlab=[peak,n-1].filter((v,i,a)=>a.indexOf(v)===i&&daily[v].v>0).map(i=>`<text class="lval" x="${X(i).toFixed(1)}" y="${(Y(daily[i].v)-8).toFixed(1)}" text-anchor="middle">${daily[i].v>=1000?(daily[i].v/1000).toFixed(1).replace(".0","")+"k":daily[i].v}</text>`).join("");
  const labs=daily.map((d,i)=> (i%2===0||i===n-1)?`<text class="lx" x="${X(i).toFixed(1)}" y="${H-6}" text-anchor="middle">${d.d}</text>`:"").join("");
  return `<svg class="lchart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
    <defs><linearGradient id="lgrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="rgba(61,225,255,.32)"/><stop offset="1" stop-color="rgba(61,225,255,0)"/></linearGradient></defs>
    <path d="${area}" fill="url(#lgrad)"/>
    <path class="lline" d="${line}" fill="none" stroke="var(--neon)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    ${dots}${vlab}${labs}${hits}</svg>`;
}

function multiLineChart(daily){
  const W=340,H=152,padL=8,padR=12,padT=22,padB=22;
  const S=[{k:"total",c:"#EAEAFF"},{k:"ig",c:"var(--neon)"},{k:"tt",c:"#FF4D9D"}];
  const val=(d,k)=> k==="total"?(d.ig+d.yt+d.tt):d[k];
  let mx=0; daily.forEach(d=>S.forEach(s=>{ const v=val(d,s.k); if(v<=12000&&v>mx)mx=v; }));
  const cap=Math.max(mx*1.12,1), n=daily.length;
  const X=i=> padL+(W-padL-padR)*(n<2?.5:i/(n-1));
  const Y=v=> padT+(H-padT-padB)*(1-Math.min(v,cap)/cap);
  let o=`<svg class="lchart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">`;
  S.forEach(s=>{
    const pts=daily.map((d,i)=>[X(i),Y(val(d,s.k)),val(d,s.k)]);
    o+=`<path d="${pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ")}" fill="none" stroke="${s.c}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>`;
    pts.forEach(p=>{ o+=`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.3" fill="${s.c}"/>`;
      if(p[2]>cap && s.k==="total") o+=`<text x="${Math.min(p[0],W-20).toFixed(1)}" y="${(p[1]-5).toFixed(1)}" text-anchor="middle" style="fill:${s.c};font-size:9px;font-weight:800;font-family:'JetBrains Mono',monospace">${Math.round(p[2]/1000)}k🚀</text>`; });
  });
  daily.forEach((d,i)=>{
    o+=`<text class="lx" x="${X(i).toFixed(1)}" y="${H-6}" text-anchor="middle">${d.d}</text>`;
    o+=`<rect class="lhit" x="${(X(i)-16).toFixed(1)}" y="0" width="32" height="${H-14}" fill="transparent" data-d="${d.d}" data-v="${d.ig+d.yt+d.tt}" data-u="всего · IG ${d.ig} · YT ${d.yt} · TT ${d.tt}"/>`;
  });
  return o+"</svg>";
}

function growthChart(f){
  const W=320,H=152,padL=8,padR=34,padT=16,padB=22;
  const pts=f.points, n=pts.length, cur=pts[n-1].v, goal=f.goal;
  const d2g=Math.max(1,Math.ceil((goal-cur)/Math.max(1,f.perDay)));
  const totalX=(n-1)+d2g;
  const X=i=> padL+(W-padL-padR)*(i/totalX);
  const Y=v=> padT+(H-padT-padB)*(1-v/goal);
  const actual=pts.map((p,i)=>(i?"L":"M")+X(i).toFixed(1)+" "+Y(p.v).toFixed(1)).join(" ");
  const ps=[X(n-1),Y(cur)], pe=[X(totalX),Y(goal)], gy=Y(goal).toFixed(1);
  const dots=pts.map((p,i)=>`<circle class="ldot${i===n-1?" llast":""}" cx="${X(i).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="${i===n-1?4.5:2.5}"/>`).join("");
  const hits=pts.map((p,i)=>`<circle class="lhit" cx="${X(i).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="14" data-d="${p.d}" data-v="${p.v}" data-u="подписчиков"/>`).join("");
  return `<svg class="lchart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
    <defs><linearGradient id="ggrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="rgba(61,225,255,.28)"/><stop offset="1" stop-color="rgba(61,225,255,0)"/></linearGradient></defs>
    <line x1="${padL}" y1="${gy}" x2="${(W-padR).toFixed(1)}" y2="${gy}" class="gline"/>
    <text class="glabel" x="${(W-padR+4).toFixed(1)}" y="${(+gy+3).toFixed(1)}">${goal}</text>
    <path d="M${X(0).toFixed(1)} ${(H-padB)} ${pts.map((p,i)=>"L"+X(i).toFixed(1)+" "+Y(p.v).toFixed(1)).join(" ")} L${X(n-1).toFixed(1)} ${(H-padB)} Z" fill="url(#ggrad)"/>
    <path class="lproj" d="M${ps[0].toFixed(1)} ${ps[1].toFixed(1)} L${pe[0].toFixed(1)} ${pe[1].toFixed(1)}"/>
    <path class="lline" d="${actual}" fill="none" stroke="var(--neon)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle class="gmark" cx="${pe[0].toFixed(1)}" cy="${gy}" r="4"/>
    <text class="glabel2" x="${(pe[0]-3).toFixed(1)}" y="${(+gy+14).toFixed(1)}" text-anchor="end">${f.etaLabel}</text>
    ${dots}${hits}
    <text class="lx" x="${X(n-1).toFixed(1)}" y="${H-6}" text-anchor="middle">сейчас · ${f.current}</text>
  </svg>`;
}

function viewToday(){
  const an=activeNiche, nObj=niche(an);
  const GT=nicheTarget(an), gdt=nicheDoneToday(an);
  const STREAK_GOAL=7, st=nicheStreak(an);
  const fillPct=Math.min(100,Math.round(st/STREAK_GOAL*100)), rem=Math.max(0,STREAK_GOAL-st);
  const lg=state.log[an]||{};
  // окно календаря = от первого дня постинга (не жёсткие 34 дня); растёт по мере выкладки
  const _lk=Object.keys(lg).filter(k=>lg[k]>0);
  let _start=6;
  if(_lk.length){ const _e=_lk.sort()[0];
    const _diff=Math.round((new Date(mKey()+"T12:00:00Z")-new Date(_e+"T12:00:00Z"))/86400000);
    _start=Math.min(69, Math.max(4, _diff+1)); }
  const seq=[]; for(let off=_start;off>=0;off--){ const key=dayKeyOffset(off); seq.push({off,cnt:off===0?gdt:(lg[key]||0),key}); }
  const firstW=(new Date(seq[0].key+"T12:00:00Z").getUTCDay()+6)%7;
  let cellsHtml=""; for(let i=0;i<firstW;i++) cellsHtml+=`<div class="cell empty"></div>`;
  seq.forEach(d=>{ const r=GT?d.cnt/GT:0, today=d.off===0?1:0, tt=`${d.key}: ${d.cnt}/${GT}`;
    if(d.cnt<=0) cellsHtml+=`<div class="cell" data-today="${today}" title="${tt}"></div>`;
    else if(r>=1) cellsHtml+=`<div class="cell full" data-today="${today}" title="${tt}">${ICONS.check}</div>`;
    else cellsHtml+=`<div class="cell fill" data-today="${today}" title="${tt}" style="--i:${(0.18+r*0.62).toFixed(2)}"></div>`; });
  const wd=["Пн","Вт","Ср","Чт","Пт","Сб","Вс"].map(x=>`<span>${x}</span>`).join("");
  const slotWord=GT===1?"слот":GT<5?"слота":"слотов";
  const hero=`<div class="hero">
    <div class="hero-top">
      <div class="streakwrap"><span class="flame">🔥</span><div>
        <div class="snum">${nicheStreak(an)} <span>дн. подряд на плане</span></div>
        <div class="ssub">«${nObj.name}» · норма ${GT} ${slotWord} в день</div></div></div>
      <div class="todaypill" data-full="${GT&&gdt>=GT?1:0}"><b>${gdt}</b>/${GT} сегодня</div>
    </div>
    <div class="cal-weekdays">${wd}</div>
    <div class="cal">${cellsHtml}</div>
    <div class="goal">
      <div class="goal-top"><span>Серия постинга</span>
        <span class="rem">цель ${STREAK_GOAL} дней · <b>${rem>0?"осталось "+rem:"есть! 🔥"}</b></span></div>
      <div class="goaltrack"><span class="fill" style="width:${fillPct}%"></span><span class="rest" style="left:${fillPct}%;width:${100-fillPct}%"></span></div>
      <div class="goal-cap">Первая цель — <b>7 дней рилсов подряд</b>. Не разрывай серию: даже один ролик в день держит ритм.</div>
    </div>
  </div>`;

  // ---- инфографика просмотров (реальные данные, снимок) ----
  const vd=VIEWS[an];
  let viewsCard="";
  if(vd){
    const g7=vd.daily.slice(-7).reduce((s,d)=>s+d.ig+d.yt+d.tt,0);
    const ttSum=vd.daily.reduce((s,d)=>s+d.tt,0);
    viewsCard=`<div class="vcard">
      <div class="vhead"><div><div class="eyebrow">Просмотры · все площадки</div>
        <div class="vtotal mono">${g7.toLocaleString("ru-RU")}</div>
        <div class="vsub">за 7 дней · IG + YouTube + TikTok</div></div>
        <div class="vupd">снимок ${vd.updated}<br>@vera_tarologinya</div></div>
      <div class="legend"><span><i style="background:#EAEAFF"></i>Всего</span><span><i style="background:var(--neon)"></i>Instagram</span><span><i style="background:#FF4D9D"></i>TikTok</span></div>
      ${multiLineChart(vd.daily)}
      <div class="goal-cap" style="margin-top:12px">🚀 Прорыв — <b>TikTok «Весы»: 101k</b> (весь остальной контент 1–10k). TikTok = твой канал, гони туда этот формат. Тапни день на графике — покажу разбивку.</div>

  // ---- вектор роста подписчиков к цели ----
  const f=FOLLOWERS[an];
  let subCard="";
  if(f){
    subCard=`<div class="vcard">
      <div class="vhead"><div><div class="eyebrow">Подписчики · вектор к цели</div>

  const slots=slotsOf(an);
  const d=slots.filter(p=>doneToday(an,p.id)).length;
  const rows=slots.map(p=>{
    const on=doneToday(an,p.id);
    return `<div class="slot" data-done="${on?1:0}" data-n="${an}" data-p="${p.id}">
      <span class="badge">${p.code}</span>
      <div class="slot-main"><div class="sn">${p.name}</div><div class="sc">1 ролик / день</div></div>
      <span class="done-at mono">${on?state.daily[an][p.id+"_t"]||"":""}</span>
      <button class="copy-btn" data-act="slotcopy">${ICONS.copy}Текст</button>
      <button class="check" data-act="slotcheck" aria-label="Выложено">${ICONS.check}</button>
    </div>`;
  }).join("");
  const block=`<div class="nblock">
    <div class="nb-head"><span class="swatch" style="background:${NICHE_COLOR[an]};color:${NICHE_COLOR[an]}"></span>

      <span class="frac" data-full="${slots.length&&d===slots.length?1:0}">${d}/${slots.length}</span></div>
    ${rows}</div>`;

  return `<div class="view-head"><div><div class="eyebrow">Норма дня · ${mShort()} МСК</div><h1>Сегодня</h1></div></div>
    ${hero}${block}${viewsCard}${subCard}`;
}

function viewVideos(){
  const dnum=d=>{const p=(d||"").split(".").map(Number);return (p[1]||0)*100+(p[0]||0);};
  const vids=(activeNiche==="all"?[...state.videos]:state.videos.filter(v=>v.niche===activeNiche)).sort((a,b)=>dnum(b.date)-dnum(a.date));
  const list=vids.length? vids.map(v=>{
    const n=niche(v.niche);
    const badges=state.platforms.filter(p=>v.targets[p.id]).map(p=>`<span class="mini-badge">${p.code}</span>`).join("");
    return `<div class="card" data-v="${v.id}"><div class="card-top" data-act="open">
      <div class="thumb" style="background:${THUMB_GRAD[v.niche]};color:${NICHE_COLOR[v.niche]}">${n.name[0]}<span class="pid">${v.id.toUpperCase()}</span></div>
      <div class="card-meta"><div class="niche-tag"><span class="swatch" style="background:${NICHE_COLOR[v.niche]};color:${NICHE_COLOR[v.niche]}"></span>${n.name} · ${v.date}</div>
        <h3>${v.title}</h3><div class="card-badges">${badges}</div></div>
      <span class="chev">${ICONS.chev}</span></div></div>`;
  }).join("") : `<div class="empty"><div class="big">Пока пусто</div>Добавь первый ролик.</div>`;
  return `<div class="view-head"><div><div class="eyebrow">Библиотека · тексты и файлы</div><h1>Ролики</h1></div></div>
    ${list}<button class="add-btn" data-act="add">${ICONS.plus}Добавить ролик</button>`;
}

function viewRhythm(){
  const ns=state.niches;
  const head=`<tr><th></th>${state.platforms.map(p=>`<th>${p.code}</th>`).join("")}</tr>`;
  const rows=ns.map(n=>{
    const cells=state.platforms.map(p=>{
      const rate=state.cadence[n.id]&&state.cadence[n.id][p.id];
      if(!rate) return `<td class="rcell"><div class="cad-cell" data-state="off"><div class="rate">—</div><div class="today">выкл</div></div></td>`;
      const on=doneToday(n.id,p.id);
      return `<td class="rcell"><div class="cad-cell" data-state="${on?"done":"due"}"><div class="rate">${rate}</div><div class="today">${on?"✓ есть":"нужно"}</div></div></td>`;
    }).join("");
    return `<tr><td class="rn">${n.name}<small>${n.tag}</small></td>${cells}</tr>`;
  }).join("");
  let due=0,done=0; ns.forEach(n=>slotsOf(n.id).forEach(p=>{ doneToday(n.id,p.id)?done++:due++; }));
  return `<div class="view-head"><div><div class="eyebrow">Регулярность · ${mShort()} МСК</div><h1>Ритм</h1></div></div>
    <div class="rhythm-wrap"><table class="rhythm"><thead>${head}</thead><tbody>${rows}</tbody></table></div>
    <div class="streak-note"><h4>${done}/${due+done} слотов закрыто сегодня</h4>
    <p>Зелёная ячейка — на сегодня выложено, жёлтая — по плану ещё нужно. Норма — минимум 1 ролик в день на каждую активную площадку. В конце дня по Москве всё обнуляется, и ритм считается заново.</p></div>`;
}

function openSheet(vid,pid){
  const v=state.videos.find(x=>x.id===vid); if(!v)return; sheetVideo=v;
  const has=state.platforms.filter(p=>v.targets[p.id]).map(p=>p.id);
  sheetPlatform=pid&&v.targets[pid]?pid:has[0];
  renderSheet(); $("#scrim").dataset.open="1"; $("#sheet").dataset.open="1"; document.body.style.overflow="hidden";
}
function closeSheet(){ $("#scrim").dataset.open="0"; $("#sheet").dataset.open="0"; document.body.style.overflow=""; sheetVideo=null; }
function renderSheet(){
  const v=sheetVideo,p=plat(sheetPlatform),t=v.targets[sheetPlatform],n=niche(v.niche);
  const strip=state.platforms.filter(pp=>v.targets[pp.id]).map(pp=>`<button class="pt" data-on="${pp.id===sheetPlatform?1:0}" data-pt="${pp.id}">${pp.code}</button>`).join("");
  $("#sheet").innerHTML=`
    <div class="sheet-grip"><span></span></div>
    <div class="sheet-head">
      <div class="thumb" style="background:${THUMB_GRAD[v.niche]};color:${NICHE_COLOR[v.niche]};width:44px;height:56px;font-size:16px">${n.name[0]}</div>
      <div style="flex:1;min-width:0"><div class="niche-tag" style="font-size:11px;color:var(--muted);font-weight:700">${n.name} · ${v.date}</div><h2>${v.title}</h2></div>
      <button class="icon-btn" data-act="close" aria-label="Закрыть">✕</button>
    </div>
    <div class="sheet-body">
      <div class="tab-strip">${strip}</div>
      ${t.ttl!==undefined?`<div class="field">
        <div class="lab"><span class="eyebrow">Название · ${p.name}</span>
          <button class="mini-copy" data-copy="ttl">${ICONS.copy}Копировать</button></div>
        <div class="box" contenteditable="true" data-edit="ttl">${esc(t.ttl)}</div></div>`:""}
      <div class="field">
        <div class="lab"><span class="eyebrow">${t.ttl!==undefined?"Описание":"Описание · "+p.name+" · хэштеги внутри"}</span>
          <button class="mini-copy" data-copy="caption">${ICONS.copy}Копировать всё</button></div>
        <div class="box" contenteditable="true" data-edit="caption">${esc(t.caption)}</div>
        ${sheetPlatform==="ig"?`<div class="hint">Instagram рекомендует 3–5 хэштегов — они уже вшиты в конец описания, отдельно вставлять не нужно.</div>`:""}
      </div>
      ${t.tags!==undefined?`<div class="field">
        <div class="lab"><span class="eyebrow">Теги · ключевые слова</span>
          <button class="mini-copy" data-copy="tags">${ICONS.copy}Копировать</button></div>
        <div class="box tagbox" contenteditable="true" data-edit="tags">${esc(t.tags)}</div>
        <div class="hint">YouTube: вставь в поле «Теги» при загрузке (не в описание).</div></div>`:""}
      <div class="field">
        <div class="lab"><span class="eyebrow">Первый комментарий</span>
          <button class="mini-copy" data-copy="first">${ICONS.copy}Копировать</button></div>
        <div class="box" contenteditable="true" data-edit="first">${esc(t.first)}</div>
      </div>
      ${Array.isArray(v.replies)&&v.replies.length?`<div class="field">
        <div class="lab"><span class="eyebrow">Доп комментарии · ответы комментаторам</span></div>
        ${v.replies.map((r,i)=>`<div class="reply-row"><div class="box reply-txt">${esc(r)}</div><button class="mini-copy" data-copy="reply" data-ri="${i}">${ICONS.copy}Копир.</button></div>`).join("")}
        <div class="hint">Каждый ответ даёт НОВУЮ инфу + вопрос-крючок и ведёт в бота (ссылка в шапке). Чередуй, не копипасть один и тот же.</div>
      </div>`:""}
      <div class="field">
        <div class="lab"><span class="eyebrow">Файлы</span>
          <button class="mini-copy" data-copy="fnames">${ICONS.copy}Имена</button></div>
        <div class="files-box">
          <div class="frow"><span class="fico">${ICONS.video}</span>
            <div class="fmeta"><div class="fn">${v.files.reel.name}</div><div class="fl">${v.files.reel.loc}</div></div>
            <button class="fopen" data-open="reel">Открыть</button></div>
          <div class="frow"><span class="fico">${ICONS.image}</span>
            <div class="fmeta"><div class="fn">${v.files.cover.name}</div><div class="fl">${v.files.cover.loc}</div></div>
            <button class="fopen" data-open="cover">Открыть</button></div>
        </div>
      </div>
      ${v.note?`<div class="auto-note">${ICONS.bolt}<div><b>Не забыть:</b> ${esc(v.note)}</div></div>`:""}
    </div>`;
}

function openAdd(){
  sheetVideo=null;
  const nsel=state.niches.map(n=>`<button class="opt" data-addn="${n.id}"><span class="swatch" style="background:${NICHE_COLOR[n.id]};color:${NICHE_COLOR[n.id]}"></span>${n.name}</button>`).join("");
  const psel=state.platforms.map(p=>`<button class="opt" data-addp="${p.id}" data-on="1">${p.code}</button>`).join("");
  $("#sheet").innerHTML=`
    <div class="sheet-grip"><span></span></div>
    <div class="sheet-head"><div style="flex:1"><div class="eyebrow">Новый ролик</div><h2>Добавить в библиотеку</h2></div>
      <button class="icon-btn" data-act="close">✕</button></div>
    <div class="sheet-body">
      <div class="field"><div class="lab"><span class="eyebrow">Название (для тебя, не публикуется)</span></div>
        <input class="inp" id="addTitle" placeholder="напр. Sora 2: видео из текста"></div>
      <div class="field"><div class="lab"><span class="eyebrow">Ниша</span></div><div class="seg" id="addNiches">${nsel}</div></div>
      <div class="field"><div class="lab"><span class="eyebrow">Площадки</span></div><div class="seg" id="addPlats">${psel}</div></div>
      <button class="primary" id="addSave" disabled>Создать пакет</button>
      <p class="hint" style="margin-top:12px">Описания под каждую площадку заполнишь внутри пакета. Имя файла соберётся по шаблону <span class="mono">ниша_дата_слаг</span>.</p>
    </div>`;
  $("#scrim").dataset.open="1"; $("#sheet").dataset.open="1"; document.body.style.overflow="hidden";
  let an=null; const ap=new Set(state.platforms.map(p=>p.id));
  const chk=()=>{ $("#addSave").disabled=!(an&&$("#addTitle").value.trim()&&ap.size); };
  $("#addTitle").addEventListener("input",chk);
  $("#addNiches").onclick=e=>{const b=e.target.closest("[data-addn]");if(!b)return;an=b.dataset.addn;[...$("#addNiches").children].forEach(o=>o.dataset.on=o===b?1:0);chk();};
  $("#addPlats").onclick=e=>{const b=e.target.closest("[data-addp]");if(!b)return;const id=b.dataset.addp;if(ap.has(id)){ap.delete(id);b.dataset.on=0;}else{ap.add(id);b.dataset.on=1;}chk();};
  $("#addSave").onclick=()=>{
    const id="v"+Date.now().toString(36);
    const targets={}; state.platforms.forEach(p=>{ if(ap.has(p.id)) targets[p.id]={caption:"",first:""}; });
    const slug=$("#addTitle").value.trim().toLowerCase().replace(/[^a-zа-я0-9]+/gi,"-").slice(0,24).replace(/^-|-$/g,"");
    state.videos.unshift({id,niche:an,title:$("#addTitle").value.trim(),date:mShort(),
      files:{reel:{name:`${an}_2026-08-22_${slug}_reel.mp4`,loc:"TG · Склад · загрузить"},
             cover:{name:`${an}_2026-08-22_${slug}_cover.jpg`,loc:"TG · Склад · загрузить"}},
      note:"",targets});
    save(); closeSheet(); render(); toast("Ролик добавлен");
  };
}

$("#niches").addEventListener("click",e=>{const b=e.target.closest("[data-n]");if(!b)return;activeNiche=b.dataset.n;render();});
$("#tabs").addEventListener("click",e=>{const b=e.target.closest("[data-view]");if(!b)return;activeView=b.dataset.view;render();window.scrollTo(0,0);});

$("#main").addEventListener("click",e=>{
  if(e.target.closest('[data-act="add"]')){ openAdd(); return; }
  const vpt=e.target.closest(".lhit"); if(vpt){ toast(vpt.dataset.d+": "+(+vpt.dataset.v).toLocaleString("ru-RU")+" "+(vpt.dataset.u||"")); return; }
  const slot=e.target.closest(".slot");
  if(slot){
    if(e.target.closest('[data-act="slotcopy"]')){ copy(firstCap(slot.dataset.n,slot.dataset.p), plat(slot.dataset.p).code+" · текст скопирован"); return; }
    if(e.target.closest('[data-act="slotcheck"]')){
      const nid=slot.dataset.n, pid=slot.dataset.p;
      if(!state.daily[nid]) state.daily[nid]={};
      const willCheck=!doneToday(nid,pid);
      const wasComplete=nicheDoneToday(nid)===nicheTarget(nid);
      const beforeStreak=nicheStreak(nid);
      if(willCheck){ state.daily[nid][pid]=mKey(); state.daily[nid][pid+"_t"]=mTime(); }
      else{ delete state.daily[nid][pid]; delete state.daily[nid][pid+"_t"]; }
      save(); render();
      if(willCheck){
        const afterStreak=nicheStreak(nid), nowComplete=nicheDoneToday(nid)===nicheTarget(nid);
        if(beforeStreak<7 && afterStreak>=7) celebrate("goal","7 дней подряд!","«"+niche(nid).name+"»: первая цель серии закрыта 🔥");
        else if(!wasComplete && nowComplete) celebrate("day","День закрыт!","Все "+nicheTarget(nid)+" площадок «"+niche(nid).name+"» сегодня ✅");
        else if(navigator.vibrate) navigator.vibrate(12);
      }
      return;
    }
    // тап по самой строке — открыть пакет на этой площадке
    const v=state.videos.find(x=>x.niche===slot.dataset.n && x.targets[slot.dataset.p]);
    if(v) openSheet(v.id, slot.dataset.p); else toast("Нет готового текста — добавь ролик в этой нише");
    return;
  }
  const open=e.target.closest('[data-act="open"]'); if(open){ openSheet(e.target.closest(".card").dataset.v,null); return; }
});

$("#scrim").addEventListener("click",closeSheet);
$("#sheet").addEventListener("click",e=>{
  if(e.target.closest('[data-act="close"]')){ closeSheet(); return; }
  const pt=e.target.closest("[data-pt]"); if(pt){ sheetPlatform=pt.dataset.pt; renderSheet(); return; }
  const cp=e.target.closest("[data-copy]"); if(cp){ const k=cp.dataset.copy, t=sheetVideo.targets[sheetPlatform];
    if(k==="fnames") copy(sheetVideo.files.reel.name+"\n"+sheetVideo.files.cover.name,"Имена файлов");
    else if(k==="reply") copy((sheetVideo.replies||[])[+cp.dataset.ri]||"","Ответ скопирован");
    else { const lbl={caption:"Описание",ttl:"Название",tags:"Теги",first:"Комментарий"}[k]||"Текст"; copy(t[k]||"", lbl+" скопировано"); }
    return; }
  if(e.target.closest("[data-open]")){ toast("Прототип: тут откроется файл из хранилища"); return; }
});
$("#sheet").addEventListener("blur",e=>{
  const ed=e.target.closest("[data-edit]"); if(!ed||!sheetVideo)return;
  const f=ed.dataset.edit; sheetVideo.targets[sheetPlatform][f]=ed.innerText;
  state.overrides[sheetVideo.id+"|"+sheetPlatform+"|"+f]=ed.innerText; save();
},true);

migrateDaily(); applyOverrides(); seedLog(); rollover(); save();
render();
initCloud();  // подтянуть/сохранять галочки в серверном хранилище артефакта
</script>

</body>
</html>
